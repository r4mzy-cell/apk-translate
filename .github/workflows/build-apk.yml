name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs || echo "build_runner failed (no annotations?), continuing..."

      - name: Analyze
        run: flutter analyze || true

      - name: Run tests
        run: flutter test || true

      - name: Build APK (release)
        shell: bash
        run: |
          set +e
          flutter build apk --release --split-per-abi --verbose > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error::BUILD FAILED exit=$code"
            # Print the "* What went wrong:" section verbatim (up to * Try:)
            awk '/\* What went wrong:/{f=1} f{print} /\* Try:/{if(f)exit}' build.log | head -60 | while IFS= read -r line; do echo "::error::WW $line"; done
            # Print exception / plugin / dependency error lines
            grep -nE "A problem occurred|Plugin \[id|was not found|Could not (find|resolve|apply)|No matching|Unsupported|requires|Caused by:|^> " build.log | head -50 | while IFS= read -r line; do echo "::error::CTX $line"; done
            # Print kotlin compiler errors
            grep -nE "e: file:|Unresolved reference|Type mismatch|None of the following|Overload resolution ambiguity|Cannot access|is not abstract|overrides nothing" build.log | head -80 | while IFS= read -r line; do echo "::error::KT $line"; done
            # Print Dart/Flutter errors
            grep -nE "Error:|error:|Compilation failed|Failed assertion|Unhandled exception|^.*\.dart:[0-9]+:.*Error" build.log | head -80 | while IFS= read -r line; do echo "::error::DART $line"; done
            echo "----- LAST 200 LINES -----"
            tail -200 build.log
            exit $code
          fi

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: |
            build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 30

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: appbundle-release
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}