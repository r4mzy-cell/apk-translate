name: translate_id
description: "Offline English-Indonesian Translator for personal use"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management - Riverpod 2.x
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Database (Drift/SQLite)
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.6.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # Force path_provider_android to use MethodChannel (pre-JNI) - avoids jni package ClassNotFoundException
  path_provider_android: 2.2.12

  # Native Integration
  ffi: ^2.1.2
  permission_handler: ^13.0.2
  device_info_plus: ^13.3.0
  get_it: ^9.3.0

  # Camera & OCR
  camera: ^0.12.2
  google_mlkit_text_recognition: ^1.0.3
  google_mlkit_commons: ^1.0.3
  image_picker: ^1.2.0

  # Network (Model Download)
  dio: ^5.4.3+1
  crypto: ^3.0.3
  archive: ^4.7.1

  # UI
  flutter_svg: ^2.0.10+1
  gap: ^3.0.1
  flutter_animate: ^4.5.0

  # Utilities
  intl: ^0.20.3
  share_plus: ^13.3.1
  url_launcher: ^6.2.6
  package_info_plus: ^10.2.2
  file_picker: ^13.4.0
  shared_preferences: ^2.5.2

  # Background Services (for screen translate)
  flutter_background_service: ^5.0.5
  flutter_overlay_window: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  drift_dev: ^2.35.3
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon_1024.png"
  adaptive_icon_background: "#1A1A2E"
  adaptive_icon_foreground: "assets/icon/app_icon_1024.png"
  min_sdk_android: 29

flutter:
  uses-material-design: true
