name: translate_id
description: "Offline English-Indonesian Translator for personal use"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Database (Drift/SQLite)
  drift: ^2.35.4
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.3
  path: ^1.9.0

  # Native Integration
  ffi: ^2.1.2
  permission_handler: ^13.0.2
  device_info_plus: ^13.3.0
  get_it: ^9.3.0
  google_fonts: ^9.0.0

  # Camera & OCR
  camera: ^0.12.2
  google_mlkit_text_recognition: ^1.0.3
  google_mlkit_commons: ^1.0.3

  # Network (Model Download)
  dio: ^5.4.3+1
  crypto: ^3.0.3
  archive: ^4.7.1

  # UI
  flutter_svg: ^2.0.10+1
  gap: ^3.0.1
  flutter_animate: ^4.5.0

  # Utilities
  intl: ^0.20.3
  share_plus: ^13.3.1
  url_launcher: ^6.2.6
  package_info_plus: ^10.2.2

  # Background Services (for screen translate)
  flutter_background_service: ^5.0.5
  flutter_overlay_window: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^4.0.10
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  drift_dev: ^2.35.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
